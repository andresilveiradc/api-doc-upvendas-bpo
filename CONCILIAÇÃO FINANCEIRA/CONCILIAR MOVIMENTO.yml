info:
  name: CONCILIAR MOVIMENTO
  type: http
  seq: 2

http:
  method: POST
  url: "{{url_local}}/conciliacao-financeira/movimentos/:idmovtocaixa/conciliar"
  params:
    - name: idmovtocaixa
      value: "42"
      type: path
  body:
    type: json
    data: |-
      {
        "valorMovimento": -150.0,
        "tipoTitulo": "PAGAR",
        "idtitulo": 45
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
