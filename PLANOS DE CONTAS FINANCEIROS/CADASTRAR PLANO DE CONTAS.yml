info:
  name: CADASTRAR PLANO DE CONTAS
  type: http
  seq: 3

http:
  method: POST
  url: "{{url_local}}/planos-contas-financeiros"
  body:
    type: json
    data: |-
      {
          "nome": "Plano 2026",
          "compartilhado": false
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
