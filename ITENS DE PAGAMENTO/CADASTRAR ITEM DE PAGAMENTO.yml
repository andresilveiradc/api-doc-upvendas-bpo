info:
  name: CADASTRAR ITEM DE PAGAMENTO
  type: http
  seq: 1

http:
  method: POST
  url: "{{url_servidor}}/itens-pagamento"
  body:
    type: json
    data: |-
      {
          "descricao": "Aluguel",
          "tipo": "Fixa",
          "pagar": true,
          "receber": false
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
