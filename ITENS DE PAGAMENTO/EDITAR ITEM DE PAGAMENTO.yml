info:
  name: EDITAR ITEM DE PAGAMENTO
  type: http
  seq: 4

http:
  method: PUT
  url: "{{url_servidor}}/itens-pagamento/:iditempagamento"
  params:
    - name: iditempagamento
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
          "descricao": "Aluguel",
          "tipo": "Fixa",
          "pagar": true,
          "receber": false,
          "ativo": true
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
