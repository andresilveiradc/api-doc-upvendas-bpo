info:
  name: LISTAR PLANOS FINANCEIROS
  type: http
  seq: 1

http:
  method: GET
  url: "{{url_local}}/planos-financeiros?pagina=1&limite_pagina=20&descricao=&analitica="
  params:
    - name: pagina
      value: "1"
      type: query
    - name: limite_pagina
      value: "20"
      type: query
    - name: descricao
      value: ""
      type: query
    - name: analitica
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
