info:
  name: CONSULTAR EXTRATO
  type: http
  seq: 7

http:
  method: GET
  url: "{{url_local}}/openfinance/extratos/:idextrato"
  params:
    - name: idextrato
      value: "3"
      type: path
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
