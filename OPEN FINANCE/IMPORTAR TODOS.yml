info:
  name: IMPORTAR TODOS
  type: http
  seq: 18

http:
  method: POST
  url: "{{url_local}}/openfinance/conciliacao/movimentos/importar-todos"
  body:
    type: json
    data: |-
      {
          "idcontabancaria": null
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
