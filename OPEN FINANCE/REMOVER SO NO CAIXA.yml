info:
  name: REMOVER SO NO CAIXA
  type: http
  seq: 17

http:
  method: DELETE
  url: "{{url_local}}/openfinance/conciliacao/pendencias/:idpendencia"
  params:
    - name: idpendencia
      value: "2"
      type: path
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
