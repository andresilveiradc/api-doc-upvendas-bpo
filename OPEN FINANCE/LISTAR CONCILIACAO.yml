info:
  name: LISTAR CONCILIACAO
  type: http
  seq: 14

http:
  method: GET
  url: "{{url_local}}/openfinance/conciliacao?pagina=1&limite_pagina=20&situacao=SO_BANCO&idcontabancaria=&data_de=&data_ate="
  params:
    - name: pagina
      value: "1"
      type: query
    - name: limite_pagina
      value: "20"
      type: query
    - name: situacao
      value: SO_BANCO
      type: query
    - name: idcontabancaria
      value: ""
      type: query
    - name: data_de
      value: ""
      type: query
    - name: data_ate
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
