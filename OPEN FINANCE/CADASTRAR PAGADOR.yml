info:
  name: CADASTRAR PAGADOR
  type: http
  seq: 1

http:
  method: POST
  url: "{{url_servidor}}/openfinance/pagadores"
  body:
    type: json
    data: |-
      {
          "nome": "Josymara Augusta Amaral Dos Reis",
          "documento": "14668879665",
          "bairro": "Centro",
          "numeroEndereco": "3140",
          "cidade": "Guanhaes",
          "uf": "MG",
          "cep": "39740000"
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
