info:
  name: CADASTRAR PAGADOR
  type: http
  seq: 1

http:
  method: POST
  url: "{{url_servidor}}/openfinance/pagadores"
  body:
    type: json
    data: |-
      {
          "nome": "ALEXANDRA C. CREMON LTDA",
          "documento": "61202938000189",
          "bairro": "INDL. AUTONOMISTAS",
          "numeroEndereco": "492",
          "cidade": "Osasco",
          "uf": "SP",
          "cep": "06010170"
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
