info:
  name: RECEBER WEBHOOK OPEN FINANCE
  type: http
  seq: 13

http:
  method: POST
  url: "{{url_servidor}}/openfinance/webhook"
  headers:
    - name: x-openfinance-webhook-secret
      value: "{{openfinance_webhook_secret}}"
  body:
    type: json
    data: |-
      {
          "evento": "extrato.concluido",
          "idExtrato": 123,
          "idConta": 53,
          "periodoDe": "2026-10-02",
          "periodoAte": "2026-10-04",
          "tipoStatement": "BANK",
          "cartaoUltimosDigitos": null,
          "status": "concluido",
          "motivoFalha": null,
          "totalMovimentos": 20,
          "saldoInicial": "0",
          "saldoFinal": "0",
          "dataSolicitacao": "2026-10-05 17:56:18.057",
          "dataConclusao": "2026-10-05 17:56:18.057",
          "creditCardLimiteDisponivelAtual": null,
          "creditCardLimiteTotalAtual": null
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
