info:
  name: IMPORTAR MOVIMENTO
  type: http
  seq: 15

http:
  method: POST
  url: "{{url_local}}/openfinance/conciliacao/movimentos/:idopenfinancemovimento/importar"
  params:
    - name: idopenfinancemovimento
      value: "1"
      type: path
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
