info:
  name: CONSULTAR CONTA VINCULADA
  type: http
  seq: 4

http:
  method: GET
  url: "{{url_servidor}}/openfinance/contas-bancarias/:idcontabancaria"
  params:
    - name: idcontabancaria
      value: "63"
      type: path
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
