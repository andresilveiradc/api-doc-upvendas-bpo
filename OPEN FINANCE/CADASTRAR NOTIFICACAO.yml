info:
  name: CADASTRAR NOTIFICACAO
  type: http
  seq: 10

http:
  method: POST
  url: "{{url_local}}/openfinance/notificacoes"
  body:
    type: json
    data: |-
      {
        "segredoWebhook": "{{openfinance_webhook_secret}}",
        "eventos": ["conta.consentimento_atualizado", "extrato.concluido"],
        "urlWebhook": "{{url_servidor}}/openfinance/webhook"
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
