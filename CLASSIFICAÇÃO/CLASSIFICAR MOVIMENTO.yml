info:
  name: CLASSIFICAR MOVIMENTO
  type: http
  seq: 2

http:
  method: PUT
  url: "{{url_local}}/classificacao/movimentos/:idmovtocaixa"
  params:
    - name: idmovtocaixa
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
          "naoGerarFinanceiro": false,
          "linhas": [
              {
                  "idplanofinanceiro": 1,
                  "iditempagamento": 1,
                  "valor": 10000
              },
              {
                  "idplanofinanceiro": 2,
                  "valor": 8450
              }
          ]
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
