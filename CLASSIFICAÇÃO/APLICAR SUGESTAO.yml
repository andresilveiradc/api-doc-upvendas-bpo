info:
  name: APLICAR SUGESTAO
  type: http
  seq: 4

http:
  method: POST
  url: "{{url_local}}/classificacao/movimentos/:idmovtocaixa/aplicar-sugestao"
  params:
    - name: idmovtocaixa
      value: "790901"
      type: path
  body:
    type: json
    data: |-
      {
        "valorMovimento": 25.8,
        "origem": "CLASSIFICACAO_BPO",
        "idmovtocaixaOrigem": 790423,
        "linhas": [
          {
            "idplanofinanceiro": 6480,
            "iditempagamento": 1551,
            "valor": 25.8
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
