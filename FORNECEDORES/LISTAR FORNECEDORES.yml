info:
  name: LISTAR FORNECEDORES
  type: http
  seq: 2

http:
  method: GET
  url: "{{url_servidor}}/fornecedores?nome_pessoa=mikael"
  params:
    - name: nome_pessoa
      value: mikael
      type: query
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
