info:
  name: EXPORTAR PDF
  type: http
  seq: 5

http:
  method: GET
  url: "{{url_local}}/caixa/movimentos/exportar?formato=pdf&data_de=&data_ate=&busca=&tipo=TODOS&idcontabancaria=60"
  params:
    - name: formato
      value: pdf
      type: query
    - name: data_de
      value: ""
      type: query
    - name: data_ate
      value: ""
      type: query
    - name: busca
      value: ""
      type: query
    - name: tipo
      value: TODOS
      type: query
    - name: idcontabancaria
      value: "60"
      type: query
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
