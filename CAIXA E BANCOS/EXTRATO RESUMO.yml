info:
  name: EXTRATO RESUMO
  type: http
  seq: 3

http:
  method: GET
  url: "{{url_local}}/caixa/extrato-resumo?data_de=2026-08-01&data_ate=2026-08-31&idcontabancaria="
  params:
    - name: data_de
      value: "2026-08-01"
      type: query
    - name: data_ate
      value: "2026-08-31"
      type: query
    - name: idcontabancaria
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
