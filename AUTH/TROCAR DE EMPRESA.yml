info:
  name: TROCAR DE EMPRESA
  type: http
  seq: 2

http:
  method: POST
  url: "{{url_servidor}}/login/trocar-empresa"
  body:
    type: json
    data: |-
      {
          "idempresa": 424
      }
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
