# O parametro "analitica" so deve ser usado se o front for exibir lista plana.
# Para montar a arvore (usando idplanopai), nao filtrar por analitica - senao as
# contas agrupadoras (pais) somem da resposta e sobram nos filhos orfaos.
info:
  name: LISTAR CONTAS
  type: http
  seq: 1

http:
  method: GET
  url: "{{url_local}}/planos-contas-financeiros/:idplano/contas"
  params:
    - name: busca
      value: ""
      type: query
      disabled: true
    - name: analitica
      value: "true"
      type: query
      disabled: true
    - name: idplano
      value: "60"
      type: path
  auth:
    type: bearer
    token: "{{token_auth}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let authHeader = res.getHeader("authorization");
        if (authHeader) {
            bru.setEnvVar("token_auth", authHeader.replace(/^Bearer\s+/i, ""));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
